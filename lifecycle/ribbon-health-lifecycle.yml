corporate:
  acquisition: >-
    Ribbon Health was acquired by H1. The API kept its host (api.ribbonhealth.com) and its docs
    subdomain (ribbon.readme.io) but the product is now branded "the H1 API" throughout the
    documentation, and support moved from team@ribbonhealth.com to support@h1.co.
  domain_migration:
    - from: https://ribbonhealth.com
      status: 404
      note: '"Site Not Configured" holding page. The brand domain is retired.'
      checked: '2026-08-14'
    - from: https://h1.co
      to: https://h1.com
      status: 301
      note: h1.co now redirects to h1.com; h1.com is the canonical corporate site.
      checked: '2026-08-14'
  residual_ribbon_branding: >-
    The API host, the docs host, the error message contact address (team@ribbonhealth.com,
    still returned by the live 401 on the API root) and the status page all still carry the
    Ribbon Health name, while the docs, the support address and the marketing site carry H1.
