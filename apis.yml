  name: Ribbon Health Price Transparency v2 API
  description: >-
    The Price Transparency v2 API from H1 (Ribbon Health) — 7 location-first operations for
    negotiated-rate shopping. Prices are scoped to a facility rather than to a provider, carriers
    use string business ids rather than v1 UUIDs, and geographic search requires an explicit
    address or lat/lng. Harvested from the OpenAPI 3.1.0 definitions H1 publishes verbatim inside
    each API reference page.
