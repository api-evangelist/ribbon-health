candidate_basis: >-
  One candidate tool per read-oriented OpenAPI operationId, grouped by product module. The write
  surface (the ~30 PUT/POST/DELETE custom-directory operations) is deliberately excluded from the
  candidate tool list: those operations mutate a customer's live provider directory, the API
  documents no idempotency key (see conventions/ribbon-health-conventions.yml), and an agent
  retrying a failed PUT has no safe replay primitive.
