  normally advertise.
deployment:
  mode: none
  endpoint: null
  install: null
  package: null
  auth: unknown
  verified: searched
  note: >-
    mode is `none` because nobody ships a server — neither a remote endpoint an agent could POST
    to nor a stdio package a human could install. The tools[] list below is a DERIVED candidate
    surface computed from the provider's OpenAPI operationIds so a builder can see what an MCP
    server over this API would look like. It is not an agent surface and must never be read as one.
pointer_decision: >-
  NO `MCPServer` pointer is emitted in apis.yml. The scoring checks that read `MCPServer`
  (mcp_server_present, 4 pts ergonomics; mcp_server, 12 pts agent readiness) assert that the
  PROVIDER ships a server. H1 does not. Pointing at a derived candidate would credit H1 with 16
  points for an agent surface that does not exist — the same failure mode as an agent card
  authored on a provider's behalf. This file stays on disk as a design input for whoever builds
  the server; it is not a claim.
server:
