  /v2/pricing/locations/procedures:
    get:
      summary: Search Location Procedure Prices (v2)
      description: 'Find **location-level** procedure prices near an address or lat/lng,

        sorted by price ascending (`min`).


        This is the primary “shop around me” endpoint for individual procedures.


        #### Location required

        Unlike v1 (which silently defaulted to a New York City address), v2 requires

        either `address` **or** both `lat` and `lng`. Missing location → HTTP 400.

        Providing only one of `lat`/`lng` → HTTP 400. Failed geocoding → HTTP 400.


        #### Example Use Case

        Search for CPT `27447` within 25 miles of ZIP `10001` for carrier `78110`,

        sorted from lowest to highest negotiated `min`, with facility address fields

        for a map UI.


        #### Carrier filtering

        Prefer `carrier_id`. `plan_id` currently returns HTTP 501.

        `carrier_id` and `plan_id` are mutually exclusive.

        '
      operationId: getV2PricingLocationProcedures
      tags:
      - Price Transparency v2
      parameters:
      - name: address
        in: query
        required: false
        description: 'Free-text address or ZIP code, geocoded server-side.


          Provide **either** `address` **or** both `lat` and `lng`. Failed geocoding returns HTTP 400.

          '
        schema:
          type: string
          example: '10001'
      - name: lat
        in: query
        required: false
        description: 'Latitude for a coordinate search. Must be provided together with `lng`.


          Provide **either** both `lat` and `lng`, **or** `address`. Providing only one of

          `lat`/`lng` returns HTTP 400.

          '
        schema:
          type: number
          format: float
          example: 40.7506
      - name: lng
        in: query
        required: false
        description: 'Longitude for a coordinate search. Must be provided together with `lat`.


          Provide **either** both `lat` and `lng`, **or** `address`. Providing only one of

          `lat`/`lng` returns HTTP 400.

          '
        schema:
          type: number
          format: float
          example: -73.9971
      - name: distance_miles
        in: query
        required: false
        description: 'Search radius in miles from the resolved address or coordinates. Must be greater than zero.

          '
        schema:
          type: number
          format: float
          exclusiveMinimum: 0
          default: 25
          example: 25
      - $ref: '#/paths/~1v2~1procedures/get/parameters/0'
      - $ref: '#/paths/~1v2~1procedures/get/parameters/1'
      - $ref: '#/paths/~1v2~1procedures/get/parameters/3'
      - name: carrier_id
        in: query
        required: false
        description: 'Filter results to a single insurance carrier using the v2 carrier business id

          (for example `78110`).


          Discover valid values with [`GET /v2/carriers`](./getv2carriers). These ids are

          **not** the same as v1 `/v1/pricing/carriers` UUIDs.


          Mutually exclusive with `plan_id` — sending both returns HTTP 400.

          '
        schema:
          type: string
          example: '78110'
      - $ref: '#/paths/~1v2~1carriers/get/parameters/1'
      - name: plan_id
        in: query
        required: false
        description: 'Reserved for filtering by a Ribbon insurance plan UUID.


          **Not functional yet** — requests that include `plan_id` return HTTP 501 until

          plan→carrier mapping is available. Prefer `carrier_id` today.


          Mutually exclusive with `carrier_id` — sending both returns HTTP 400.

          '
        schema:
          type: string
          example: 81ba3a1a-05a9-48d9-b9b2-cb8f9eafc902
      - $ref: '#/paths/~1v2~1carriers/get/parameters/2'
      - $ref: '#/paths/~1v2~1carriers/get/parameters/3'
      responses:
        '200':
          description: Location procedure price hits near the search point.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1v2~1carriers/get/responses/200/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: 'Geographic search hit for a location-level procedure price. Sorted by `min`

                          ascending. Includes facility identity and geo fields for mapping UIs.

                          '
                        required:
                        - location_id
                        - carrier_id
                        - procedure_code
                        - min
                        - median
                        - avg
                        - max
                        properties:
                          location_id:
                            type: string
                            example: '1001'
                          location_name:
                            type: string
                            example: Example Orthopedic Center
                          address:
                            type: string
                            example: 123 Main St, New York, NY 10001
                          state:
                            type: string
                            example: NY
                          latitude:
                            type: number
                            format: float
                            example: 40.7506
                          longitude:
                            type: number
                            format: float
                            example: -73.9971
                          npi:
                            type:
                            - integer
                            - 'null'
                            description: Null for location-level hits.
                            example: null
                          carrier_id:
                            type: string
                            example: '78110'
                          carrier_name:
                            type: string
                            example: Aetna
                          procedure_code:
                            type: string
                            example: '27447'
                          procedure_code_scheme:
                            type: string
                            example: CPT
                          procedure_description:
                            type: string
                            example: Total knee arthroplasty
                          care_cluster_code:
                            type: string
                            description: Present when the procedure is associated with a care cluster.
                            example: JOINT_REPLACEMENT
                          negotiated_type:
                            type: string
                            example: negotiated
                          negotiation_arrangement:
                            type: string
                            example: ffs
                          min:
                            type: number
                            format: float
                            example: 14200
                          median:
                            type: number
                            format: float
                            example: 16850
                          avg:
                            type: number
                            format: float
                            example: 17120.5
                          max:
                            type: number
                            format: float
                            example: 21400
              example:
                parameters:
                  address: '10001'
                  procedure_code: '27447'
                  carrier_id: '78110'
                  distance_miles: 25
                total_count: 18
                page: 1
                page_size: 20
                data:
                - location_id: '1001'
                  location_name: Example Orthopedic Center
                  address: 123 Main St, New York, NY 10001
                  state: NY
                  latitude: 40.7506
                  longitude: -73.9971
                  npi: null
                  carrier_id: '78110'
                  carrier_name: Aetna
                  procedure_code: '27447'
                  procedure_code_scheme: CPT
                  procedure_description: Total knee arthroplasty
                  care_cluster_code: JOINT_REPLACEMENT
                  negotiated_type: negotiated
                  negotiation_arrangement: ffs
                  min: 14200
                  median: 16850
                  avg: 17120.5
                  max: 21400
        '400':
          description: 'Invalid search — missing location, incomplete lat/lng, failed geocode,

            or mutually exclusive carrier filters.

            '
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1carriers/get/responses/400/content/application~1json/schema'
        '403':
          description: The caller does not have Price Transparency access.
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1carriers/get/responses/403/content/application~1json/schema'
        '501':
          description: '`plan_id` filtering is not implemented yet.'
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1carriers/get/responses/400/content/application~1json/schema'
  /v2/pricing/locations/care-clusters:
    get:
      summary: Search Location Care Cluster Prices (v2)
      description: 'Find **location-level** care-cluster (bundle) prices near an address or

        lat/lng, sorted by `bundle_price` ascending.


        Same geo / carrier / pagination rules as

        [`GET /v2/pricing/locations/procedures`](./getv2pricinglocationprocedures).


        Optional `procedure_code` filters to bundles whose `included_procedures`

        contain that code.


        #### Location required

        Provide either `address` **or** both `lat` and `lng`. Missing location,

        incomplete coordinates, or failed geocoding → HTTP 400.

        '
      operationId: getV2PricingLocationCareClusters
      tags:
      - Price Transparency v2
      parameters:
      - $ref: '#/paths/~1v2~1pricing~1locations~1procedures/get/parameters/0'
      - $ref: '#/paths/~1v2~1pricing~1locations~1procedures/get/parameters/1'
      - $ref: '#/paths/~1v2~1pricing~1locations~1procedures/get/parameters/2'
      - $ref: '#/paths/~1v2~1pricing~1locations~1procedures/get/parameters/3'
      - $ref: '#/paths/~1v2~1procedures/get/parameters/3'
      - $ref: '#/paths/~1v2~1procedures/get/parameters/4'
      - $ref: '#/paths/~1v2~1procedures/get/parameters/0'
      - $ref: '#/paths/~1v2~1pricing~1locations~1procedures/get/parameters/7'
      - $ref: '#/paths/~1v2~1carriers/get/parameters/1'
      - $ref: '#/paths/~1v2~1pricing~1locations~1procedures/get/parameters/9'
      - $ref: '#/paths/~1v2~1carriers/get/parameters/2'
      - $ref: '#/paths/~1v2~1carriers/get/parameters/3'
      responses:
        '200':
          description: Location care cluster price hits near the search point.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/paths/~1v2~1carriers/get/responses/200/content/application~1json/schema/allOf/0'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        description: 'Geographic search hit for a location-level care-cluster (bundle) price.

                          Sorted by `bundle_price` ascending.

                          '
                        required:
                        - location_id
                        - carrier_id
                        - care_cluster_code
                        - bundle_price
                        properties:
                          location_id:
                            type: string
                            example: '1001'
                          location_name:
                            type: string
                            example: Example Orthopedic Center
                          address:
                            type: string
                            example: 123 Main St, New York, NY 10001
                          state:
                            type: string
                            example: NY
                          latitude:
                            type: number
                            format: float
                          longitude:
                            type: number
                            format: float
                          npi:
                            type:
                            - integer
                            - 'null'
                            description: Null for location-level hits.
                            example: null
                          carrier_id:
                            type: string
                            example: '78110'
                          carrier_name:
                            type: string
                            example: Aetna
                          care_cluster_code:
                            type: string
                            example: JOINT_REPLACEMENT
                          care_cluster_description:
                            type: string
                            example: Joint Replacement
                          bundle_price:
                            type: number
                            format: float
                            description: Sort key (ascending).
                            example: 28500
                          procedure_count:
                            type: integer
                            example: 4
                          expected_procedure_count:
                            type: integer
                            example: 5
                          completeness_pct:
                            type: number
                            format: float
                            example: 80
                          included_procedures:
                            type: array
                            items: {}
                          missing_procedures:
                            type: array
                            items: {}
              example:
                parameters:
                  lat: 40.75
                  lng: -73.99
                  care_cluster_code: JOINT_REPLACEMENT
                  distance_miles: 25
                total_count: 7
                page: 1
                page_size: 20
                data:
                - location_id: '1001'
                  location_name: Example Orthopedic Center
                  address: 123 Main St, New York, NY 10001
                  state: NY
                  latitude: 40.7506
                  longitude: -73.9971
                  npi: null
                  carrier_id: '78110'
                  carrier_name: Aetna
                  care_cluster_code: JOINT_REPLACEMENT
                  care_cluster_description: Joint Replacement
                  bundle_price: 28500
                  procedure_count: 4
                  expected_procedure_count: 5
                  completeness_pct: 80
                  included_procedures:
                  - '27447'
                  missing_procedures:
                  - '27445'
        '400':
          description: 'Invalid search — missing location, incomplete lat/lng, failed geocode,

            or mutually exclusive carrier filters.

            '
          content:
            application/json:
              schema:
                $ref: '#/paths/~1v2~1carriers/get/responses/400/content/application~1json/schema'
        '403':
