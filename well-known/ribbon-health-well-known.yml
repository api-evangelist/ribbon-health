    https://www.atlassian.com/trust/security/report-a-vulnerability, whose Canonical is
    https://www.atlassian.com/.well-known/security.txt, and which is signed by
    security@atlassian.com. It is served on every *.statuspage.io-backed custom domain and says
    nothing about Ribbon Health or H1.
  decision: recorded as a miss; NOT saved as ribbon-health-security.txt, NOT pointed at.
