pointer_basis: >-
  NO WellKnown pointer. NO SecurityTxt pointer. The only 200 on any probed /.well-known/ path in
  this repo is Atlassian's own security.txt served by the Statuspage platform that hosts
  status.ribbonhealth.com — see vendor_false_positive below. Crediting Ribbon Health for it
  would credit H1 with a vulnerability-disclosure posture that belongs to its status-page vendor.
