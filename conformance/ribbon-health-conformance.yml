      checked: '2026-08-14'
    - url: https://trust.h1.com/
      status: 000
      note: DNS does not resolve.
      checked: '2026-08-14'
  note: >-
    No trust center, no named certification (SOC 2 / ISO 27001 / HITRUST / HIPAA attestation) is
    published on any public H1 or Ribbon Health page that this pass could reach. NO `Compliance`
