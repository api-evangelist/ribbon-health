    code: null
    title: Malformed request
    description_from_spec: A failure due to a malformed request
    occurrences_in_spec: 36
    remediation: >-
      Most commonly a missing or conflicting query parameter. Documented v2 cases: Price
      Transparency v2 search requires either `address` or both `lat` and `lng` (missing location,
      only one of lat/lng, or a geocoding failure all return 400), and sending both `carrier_id`
