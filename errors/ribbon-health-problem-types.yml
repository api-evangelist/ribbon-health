    description_from_spec: Trial accounts do not have access to custom specialties
    occurrences_in_spec: 18
    remediation: >-
      Entitlement failure, not an auth failure. The customer's package does not include the
      module. The docs express entitlements as named flags (e.g. `doctors.can_price_transparency`
