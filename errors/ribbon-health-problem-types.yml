    code: not_authenticated
    title: No API key supplied
    message_observed: >-
      You did not provide an API Key. If you need help, please feel free to contact us at
      team@ribbonhealth.com!
    alternate_message_observed: Authentication credentials were not provided.
    remediation: >-
      Send `Authorization: Bearer {customer_token}`. Two different messages are returned for the
      same code depending on path (the API root vs a /v1 resource), so branch on `code`, never
      on `message`.
    evidence:
