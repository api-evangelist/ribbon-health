format: custom-json-envelope
rfc9457: false
summary: >-
  The H1 API returns a consistent nested JSON error envelope on every failure. It is NOT RFC 9457
  problem+json — content type is application/json, there is no `type` URI and no `title`/`detail`
  split — but it is machine-parseable and carries a stable snake_case `code` that is more useful
  than the HTTP status alone.
envelope:
  content_type: application/json
  shape: '{"error": {"status": <int>, "code": "<snake_case_code>", "message": "<string>"}}'
  fields:
    - name: error.status
      type: integer
      description: Duplicates the HTTP status code inside the body.
    - name: error.code
      type: string
      description: Stable snake_case machine code. This is the field to branch on.
    - name: error.message
      type: string
      description: Human-readable explanation. Not stable; do not parse.
  correlation_header: ribbon-request-id
  correlation_note: >-
    Every error response carries a `ribbon-request-id` header (32-char hex). Quote it to support.
    Observed on live 401/404 responses; undocumented by the provider.
problems:
